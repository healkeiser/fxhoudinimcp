name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# A tag push and the main push behind it start two deploys within seconds, and
# both push to gh-pages. The second to push is rejected with "fetch first" and
# the run fails (it happened twice on the day v2.11.0 and v2.11.1 shipped).
# Serialise them; never cancel, because each deploy publishes a different
# version and both must land.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.mkdocs.txt

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Fetch gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            echo "Fetched existing gh-pages branch"
          else
            echo "gh-pages branch does not exist yet, mike will create it"
          fi

      - name: Deploy docs (versioned)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.1.0")
          mike deploy --push --update-aliases "$VERSION" latest
          git fetch origin gh-pages:gh-pages --force
          mike set-default --push latest
          echo "Mike versions:"
          mike list
